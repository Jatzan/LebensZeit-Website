<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Kundenportal — LebensZeit gGmbH</title>
<meta name="description" content="Kundenportal der LebensZeit gGmbH — Termine, Unterlagen, Mitgliedschaft und Kontakt. Fiktives Schulungsprojekt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lz-tokens.css">
<style>
/* Kundenportal · JO · 07.08.2026
   Umgebung 03: Creme-warm, Akzent Gruen, Logo Waldgruen, 1,19rem, Radius 24,
   Tippziel 56. Zielgruppe ueber 75 — Person vor Leistung, Status immer als
   Wort mit Zeichen, keine Emojis, viel Weissraum.
   Acht Bereiche. Ab 860px liegen sie offen und brechen in zwei Zeilen um,
   darunter kommt der Hamburger — eine Zielgruppe ueber 75 sollte die
   Navigation sehen, solange der Platz reicht. */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;background:var(--surface);color:var(--text);
  font-size:var(--fs-body);line-height:var(--lh-body-env);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:500;color:var(--lz-green-3);line-height:1.18}
.wrap{max-width:860px;margin:0 auto;padding:0 22px}
button{font:inherit}
a{color:var(--lz-green)}
:focus-visible{outline:3px solid var(--lz-forest);outline-offset:3px;border-radius:8px}

.lockup{display:inline-flex;align-items:center;gap:13px;color:var(--logo);text-decoration:none}
.lockup .sym{width:38px;height:38px;flex:0 0 38px}
.lockup .name{font-family:Georgia,'Times New Roman',serif;font-size:1.44rem;line-height:1}
.lockup .name sup{font-family:'Jost',sans-serif;font-size:.52em;letter-spacing:.06em;vertical-align:super}
a.lockup:hover{opacity:.82}

/* Eingabefelder in den Portalformularen — dieselbe Anmutung wie in der Anmeldung */
.form{display:flex;flex-direction:column;gap:16px;max-width:460px;margin-top:18px}
.form label{display:block;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;
  color:var(--text-2);font-weight:600;margin-bottom:7px}
.form input{width:100%;min-height:var(--tap-env);padding:12px 15px;font:inherit;font-size:1rem;
  color:var(--text);background:var(--lz-white);border:1px solid var(--line-ui);border-radius:14px;
  font-variant-numeric:tabular-nums}
.form .hinweis{font-size:.94rem;color:var(--text-2);line-height:1.5}
/* Fehlermeldung am Feld. Der Zustand haengt nicht an der Farbe allein: das
   Feld bekommt zusaetzlich aria-invalid und die Meldung steht als Text
   darunter, verknuepft ueber aria-describedby. */
.form input[aria-invalid="true"]{border-color:var(--lz-red);border-width:2px}
/* Der Fokusring bleibt Pflicht, faerbt sich auf dem fehlerhaften Feld aber
   mit: gruener Ring um roten Rahmen las sich wie zwei konkurrierende Rahmen. */
.form input[aria-invalid="true"]:focus-visible{outline-color:var(--lz-red)}
.form .feldfehler{display:none;margin-top:7px;font-size:.94rem;line-height:1.45;color:var(--lz-red)}
.form .feldfehler.an{display:flex;gap:.5em;align-items:baseline}
.form .feldfehler.an::before{content:"!";flex:0 0 auto;font-weight:700;
  width:1.25em;height:1.25em;border-radius:50%;border:1.5px solid currentColor;
  display:inline-flex;align-items:center;justify-content:center;font-size:.8em}
.knopf-voll[disabled]{opacity:.55;cursor:default}
.knopf-voll[disabled]:hover{background:var(--lz-green)}
.knopf-voll{min-height:var(--tap-env);padding:0 26px;border-radius:var(--radius);border:0;
  background:var(--lz-green);color:var(--lz-cream);font-size:1.06rem;cursor:pointer}
.knopf-voll:hover{background:var(--lz-green-2)}
.warnbox{background:rgba(140,58,42,.06);border:1px solid rgba(140,58,42,.35);
  border-left:5px solid var(--lz-red);border-radius:var(--radius);padding:22px 26px;margin-top:6px}
.warnbox h3{font-size:1.19rem;color:var(--lz-red);margin-bottom:10px}
.warnbox ul{list-style:none;display:flex;flex-direction:column;gap:9px;color:var(--text-2);font-size:1rem}
.warnbox li{padding-left:22px;position:relative}
.warnbox li::before{content:"\2212";position:absolute;left:0;color:var(--lz-red)}
.antwort.ernst{border-color:var(--lz-red);color:var(--lz-red)}
.antwort.ernst:hover{background:rgba(140,58,42,.08)}

/* ── Anmeldung ──────────────────────────────────────── */
#gate{position:fixed;inset:var(--tick-h,2.375rem) 0 0 0;z-index:200;background:var(--surface);
  display:flex;align-items:center;justify-content:center;padding:24px 18px;overflow-y:auto}
#gate.weg{display:none}
.gatecard{width:100%;max-width:470px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:38px 32px 32px;box-shadow:0 18px 48px rgba(74,103,65,.10)}
.gatecard .kopf{text-align:center;margin-bottom:26px}
.gatecard h1{font-size:1.75rem;margin-top:16px}
.gatecard .kopf p{color:var(--text-2);font-size:.94rem;margin-top:6px}
.feld{margin-bottom:18px}
.feld label{display:block;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;
  color:var(--text-2);font-weight:600;margin-bottom:7px}
.feld select,.feld input{width:100%;min-height:var(--tap-env);padding:12px 15px;font:inherit;
  font-size:1rem;color:var(--text);background:var(--lz-white);border:1px solid var(--line-ui);border-radius:14px}
.gatehinweis{font-size:.88rem;color:var(--text-2);margin:2px 0 20px;line-height:1.5}
.knopf{display:block;width:100%;min-height:var(--tap-env);border:0;border-radius:var(--radius);
  background:var(--lz-green);color:var(--lz-cream);font-size:1.06rem;font-weight:500;cursor:pointer}
.knopf:hover{background:var(--lz-green-2)}
.gatefuss{text-align:center;font-size:.88rem;color:var(--text-3);margin-top:20px}

/* ── Kopf ───────────────────────────────────────────── */
#portal[hidden]{display:none}
header.portal{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60}
header .oben{max-width:860px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px}
header .oben .rechts{margin-left:auto;display:flex;align-items:center;gap:12px}
.person{display:inline-flex;align-items:center;gap:10px;font-size:.94rem;color:var(--text-2)}
.avatar{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;background:var(--lz-green);color:var(--lz-cream);font-size:.94rem;font-weight:600;letter-spacing:.5px}
.avatar.wald{background:var(--lz-forest)}
/* Knopffarben: gefuellt = Markengruen mit Creme (5,60:1), umrandet = Gruen auf
   Weiss (6,35:1). Vorher stand der Abmeldeknopf auf --text-2 mit Rahmen in
   --line-ui, was ihn wie eine deaktivierte Flaeche aussehen liess. */
.knopf-rand{min-height:var(--tap-env);padding:0 20px;border-radius:var(--radius);
  border:1px solid var(--lz-green);background:transparent;color:var(--lz-green);cursor:pointer;font-size:.94rem}
.knopf-rand:hover{background:rgba(74,103,65,.10)}
/* Burger auf ALLEN Breiten. Die Reiterzeile stand nur am Desktop und zeigte
   acht Bereiche gleichzeitig — auf 860px umgebrochen in zwei Zeilen, damit ein
   zweiter waagerechter Balken unter der Kopfzeile. Ein Menue, ein Ort: die
   Bereiche liegen jetzt ueberall in der Schublade, das Portal hat damit dieselbe
   Bedienung auf Telefon und Rechner. nav.reiter ist komplett entfallen. */
#burger{display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:var(--tap-env);padding:0 18px;border-radius:var(--radius);
  border:1px solid var(--lz-green);background:transparent;color:var(--lz-green);cursor:pointer;font-size:1rem}
#burger svg{width:24px;height:24px}

/* ── Navigation ─────────────────────────────────────── */
/* Die waagerechte Reiterzeile nav.reiter ist am 13.08.2026 entfallen — siehe
   Kommentar am Burger. Es gibt nur noch die Schublade. */

#schublade{position:fixed;inset:var(--tick-h,2.375rem) 0 0 0;z-index:150;background:var(--surface);
  display:none;flex-direction:column;overflow-y:auto}
#schublade.offen{display:flex}
#schublade .kopfz{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line)}
#schublade .kopfz .zu{margin-left:auto}
#schublade ul{list-style:none;padding:8px 0}
#schublade li button{display:flex;align-items:center;gap:16px;width:100%;min-height:64px;
  padding:0 24px;border:0;background:none;color:var(--text);font-size:1.19rem;text-align:left;cursor:pointer}
#schublade li button svg{width:28px;height:28px;flex:0 0 28px;color:var(--lz-forest)}
#schublade li button[aria-current="page"]{background:rgba(74,103,65,.10);color:var(--lz-green-3);font-weight:500}

main{padding:30px 0 70px}
.anrede{font-size:2rem;font-family:'Cormorant Garamond',serif;color:var(--lz-green-3);font-weight:500}
.datum{color:var(--text-2);font-size:1rem;margin-top:4px;font-variant-numeric:tabular-nums}

.naechst{margin:26px 0 0;background:var(--lz-white);border:1px solid var(--line);
  border-left:5px solid var(--lz-green);border-radius:var(--radius);padding:28px 30px}
.naechst .label{font-size:.8rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--lz-green);font-weight:600}
.naechst .satz{font-size:1.44rem;font-family:'Cormorant Garamond',serif;color:var(--lz-green-3);margin:12px 0 4px;line-height:1.3}
.naechst .zeit{font-size:1.19rem;color:var(--text);font-variant-numeric:tabular-nums}
.wer{display:flex;align-items:center;gap:14px;margin-top:20px}
.wer .rolle{font-size:.94rem;color:var(--text-2)}

section.karte{background:var(--lz-white);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 30px;margin-top:22px}
section.karte > h2{font-size:1.38rem;margin-bottom:4px}
section.karte > p.unter{color:var(--text-2);font-size:.94rem;margin-bottom:16px}

.woche{list-style:none}
.woche li{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:start;
  padding:18px 0;border-bottom:1px solid rgba(74,103,65,.12)}
.woche li:last-child{border-bottom:0}
.woche .tag{grid-column:1;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-2);font-weight:600}
.woche .zeile{grid-column:1;font-size:1.19rem;color:var(--text);font-variant-numeric:tabular-nums;margin-top:3px}
.woche .leistung{grid-column:1;font-size:.94rem;color:var(--text-2);margin-top:2px}
.woche .status{grid-column:2;grid-row:1 / span 3;justify-self:end;align-self:center}
.status{display:inline-flex;align-items:center;gap:8px;font-size:.94rem;font-weight:500;white-space:nowrap}
.status .zeichen{font-size:1.06rem;line-height:1}
.st-erledigt{color:var(--lz-green)}
.st-geplant{color:var(--text-2)}
.st-unterwegs{color:var(--lz-amber-ink)}
.st-offen{color:var(--lz-info)}

.rueck{background:rgba(74,103,65,.06);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 30px;margin-top:22px}
.rueck h2{font-size:1.38rem}
.rueck p{margin:8px 0 20px;color:var(--text-2)}
.antworten{display:flex;flex-direction:column;gap:12px;max-width:460px}
.antwort{min-height:var(--tap-env);padding:14px 22px;border-radius:var(--radius);
  border:1px solid var(--lz-green);background:var(--lz-white);color:var(--lz-green-3);
  cursor:pointer;font-size:1.06rem;text-align:left}
.antwort:hover{background:rgba(74,103,65,.10)}
.danke{color:var(--lz-green);font-weight:500;display:flex;align-items:center;gap:9px}

.liste{list-style:none}
.liste li{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:18px 0;border-bottom:1px solid rgba(74,103,65,.12)}
.liste li:last-child{border-bottom:0}
.liste .titel{font-size:1.06rem;color:var(--text)}
.liste .meta{font-size:.88rem;color:var(--text-2);font-variant-numeric:tabular-nums}
.liste .rechts{margin-left:auto;display:flex;align-items:center;gap:14px}
.format{font-size:.8rem;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;
  color:var(--text-2);border:1px solid var(--line);border-radius:20px;padding:3px 11px}
.betrag{font-size:1.19rem;font-variant-numeric:tabular-nums;color:var(--text)}

/* Brett */
.brett{list-style:none;display:flex;flex-direction:column;gap:16px}
.brett li{background:var(--lz-white);border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px}
.brett li.gepinnt{border-left:5px solid var(--lz-amber)}
.brett .kat{font-size:.8rem;letter-spacing:2px;text-transform:uppercase;font-weight:600;color:var(--lz-forest)}
.brett h3{font-size:1.38rem;margin:8px 0 6px}
.brett p{color:var(--text-2);font-size:1rem}
.brett .wann{margin-top:12px;font-size:1rem;color:var(--text);font-variant-numeric:tabular-nums}
.brett .ort{font-size:.94rem;color:var(--text-2)}

/* Mitgliedschaft */
.stufen{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.stufe{background:var(--lz-white);border:1px solid var(--line);border-radius:var(--radius);padding:24px 22px;
  display:flex;flex-direction:column}
.stufe.aktuell{border:2px solid var(--lz-green);background:rgba(74,103,65,.05)}
.stufe .name{font-family:'Cormorant Garamond',serif;font-size:1.38rem;color:var(--lz-green-3)}
.stufe .preis{font-family:'Cormorant Garamond',serif;font-size:1.75rem;color:var(--lz-green);
  margin:6px 0 2px;font-variant-numeric:tabular-nums}
.stufe .je{font-size:.88rem;color:var(--text-2)}
.stufe ul{list-style:none;margin:16px 0 20px;display:flex;flex-direction:column;gap:10px;font-size:.94rem;color:var(--text-2)}
.stufe li{padding-left:22px;position:relative}
.stufe li::before{content:"\2713";position:absolute;left:0;color:var(--lz-green);font-size:1rem}
.stufe .fuss{margin-top:auto}
.jetzt{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;letter-spacing:1.5px;
  text-transform:uppercase;font-weight:600;color:var(--lz-green);
  background:rgba(74,103,65,.12);border-radius:20px;padding:6px 14px}

/* Services */
.dienste{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
.dienste > section.karte,.stufen > section.karte{grid-column:1/-1;margin-top:0}
.dienst{display:flex;align-items:flex-start;gap:16px;width:100%;min-height:var(--tap-env);
  background:var(--lz-white);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 24px;cursor:pointer;text-align:left;color:var(--text);text-decoration:none}
.dienst:hover{border-color:var(--lz-green);background:rgba(74,103,65,.05)}
.dienst svg{width:28px;height:28px;flex:0 0 28px;color:var(--lz-forest);margin-top:2px}
.dienst b{display:block;font-size:1.06rem;font-weight:500;color:var(--lz-green-3)}
.dienst span{font-size:.94rem;color:var(--text-2)}

/* Eigenanteil */
.rechnung{list-style:none;margin-top:8px}
.rechnung li{display:flex;justify-content:space-between;gap:18px;padding:14px 0;
  border-bottom:1px solid rgba(74,103,65,.12);font-variant-numeric:tabular-nums}
.rechnung li:last-child{border-bottom:0;border-top:2px solid var(--lz-green);
  margin-top:6px;padding-top:16px;font-size:1.19rem;color:var(--lz-green-3);font-weight:500}
.rechnung .pos{color:var(--text-2)}
.rechnung li:last-child .pos{color:var(--lz-green-3)}

.zeiten{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.zeiten div{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;
  padding-bottom:14px;border-bottom:1px solid rgba(74,103,65,.12)}
.zeiten div:last-child{border-bottom:0;padding-bottom:0}
.zeiten b{min-width:11ch;font-weight:500;color:var(--lz-green-3)}
.zeiten span{color:var(--text-2);font-variant-numeric:tabular-nums}
.telefon{display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:var(--tap-env);padding:0 26px;border-radius:var(--radius);
  background:var(--lz-green);color:var(--lz-cream);text-decoration:none;font-size:1.06rem;margin-top:4px}
.telefon:hover{background:var(--lz-green-2)}
.kontaktliste{list-style:none}
.kontaktliste li{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 0;
  border-bottom:1px solid rgba(74,103,65,.12)}
.kontaktliste li:last-child{border-bottom:0}
.kontaktliste .rechts{margin-left:auto}

.mitglied{display:inline-flex;align-items:center;gap:9px;min-height:var(--tap-env);font-size:.88rem;
  letter-spacing:1px;text-transform:uppercase;font-weight:600;color:var(--lz-forest);
  background:rgba(90,110,82,.12);border:1px solid rgba(90,110,82,.35);border-radius:var(--radius);
  padding:0 20px;text-decoration:none}
a.mitglied:hover{background:rgba(90,110,82,.20)}

footer.portal{border-top:1px solid var(--line);margin-top:50px;padding:26px 0 40px;font-size:.88rem;color:var(--text-2)}
footer.portal .wrap{display:flex;align-items:center;flex-wrap:wrap;gap:10px 22px}
/* Kompaktstufe: 26px Symbol, Wortmarke ohne Claims, Farbe aus der Rolle --logo
   (unter .env-portal Waldgruen auf warmem Creme). */
.lockup.klein .sym{width:26px;height:26px;flex:0 0 26px}
.lockup.klein .name{font-size:1.06rem;letter-spacing:1.4px}
footer.portal .fz-links{display:inline-flex;gap:6px;flex-wrap:wrap}
footer.portal .fz-fiktiv{margin-left:auto;color:var(--text-3)}
@media(max-width:640px){ footer.portal .fz-fiktiv{margin-left:0} }

@media(max-width:860px){
  header .oben .person > span:not(.avatar){display:none}
  .stufen,.dienste{grid-template-columns:1fr}
}
/* Unter 860px messen Logo, Men\u00fc, Person und Abmelden zusammen 473px \u2014 mehr als
   der Viewport. Der Browser weitet daraufhin die gesamte Seite auf, nicht nur die
   Kopfzeile. Deshalb: Hamburger nur als Zeichen, Abmelden wandert in die
   Schublade, wo es als seltene Aktion ohnehin besser aufgehoben ist. */
@media(max-width:560px){
  #burger{padding:0;width:var(--tap-env);gap:0}
  #burger .wort{display:none}
  header .rechts > .knopf-rand{display:none}
}
#schublade .fussz{margin-top:auto;padding:20px 24px 32px;border-top:1px solid var(--line)}
#schublade .fussz .knopf-rand{width:100%}
@media(max-width:640px){
  .wrap{padding:0 16px}
  header .oben{padding:12px 16px}
  .naechst,section.karte,.rueck,.brett li{padding:22px 20px}
  .woche li{grid-template-columns:1fr}
  .woche .status{grid-column:1;grid-row:auto;justify-self:start;margin-top:8px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="env-portal">

<div id="gate">
  <div class="gatecard">
    <div class="kopf">
      <a class="lockup" href="/" title="Zur Startseite" style="justify-content:center">
        <svg class="sym" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="100" cy="100" r="86" fill="none" stroke="currentColor" stroke-width="7"/>
          <circle cx="100" cy="28" r="13" fill="currentColor"/><circle cx="168.5" cy="77.8" r="13" fill="currentColor"/>
          <circle cx="142.3" cy="158.3" r="13" fill="currentColor"/><circle cx="57.7" cy="158.3" r="13" fill="currentColor"/>
          <circle cx="31.5" cy="77.8" r="13" fill="currentColor"/><circle cx="100" cy="100" r="15" fill="currentColor"/>
        </svg>
      </a>
      <h1>Kundenportal</h1>
      <p>Ihre Termine, Unterlagen und der Draht zum Pflegeteam.</p>
    </div>

    <div class="feld">
      <label for="rolle">Anmelden als</label>
      <select id="rolle">
        <optgroup label="Kundenportal">
          <option value="stemmer">Hildegard Stemmer · Pflegekundin · Rüthen</option>
          <option value="doerre">Markus Dörre · Angehöriger · Lippetal</option>
        </optgroup>
        <optgroup label="Kunden-App">
          <option value="app">Kunden-App · dieselben Inhalte auf dem Telefon</option>
        </optgroup>
      </select>
    </div>
    <div class="feld">
      <label for="kennung">Benutzerkennung</label>
      <input id="kennung" type="text" autocomplete="username" readonly>
    </div>
    <div class="feld">
      <label for="passwort">Passwort</label>
      <input id="passwort" type="password" autocomplete="current-password" value="Beispiel2026" readonly>

/* ── Ablaufmechanik ────────────────────────────────────────────────────
   Jeder Knopf im Portal führt zu einem der fünf Ausgänge. Vorher hingen
   die Knöpfe an einer einzigen Sammelroutine, die immer nur „Danke" sagte —
   deshalb wirkten Mitgliedschaft, Services und Brett funktionslos.
     text     — Bestätigung, Ende
     optionen — nächste Auswahl im selben Kasten
     formular — vorbelegte Felder, danach Bestätigung
     mailto   — vorbereitete E-Mail öffnen
     tun      — beliebige Funktion (Bereichswechsel, Stufenwechsel)          */
function zeigeSchritt(host, schritt){
  if (schritt.tun) { schritt.tun(); return; }
  if (schritt.mailto) { location.href = schritt.mailto; }
  var h = '';
  if (schritt.titel) h += '<h3 style="font-size:1.19rem;margin-bottom:10px">' + esc(schritt.titel) + '</h3>';
  if (schritt.text)  h += '<p class="danke"><span aria-hidden="true">\u2713</span>' + esc(schritt.text) + '</p>';
  if (schritt.warnung) {
    h += '<div class="warnbox"><h3>' + esc(schritt.warnung.titel) + '</h3><ul>' +
      schritt.warnung.punkte.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul></div>';
  }
  if (schritt.formular) {
    /* Drittes Feldelement ist die Pruefart: "iban" oder "pflicht".
       Ohne Angabe wird nicht geprueft (z. B. vorbelegte Anzeigefelder). */
    h += '<div class="form">' + schritt.formular.map(function(f, i){
      var art = f[2] || '';
      return '<div><label for="fv' + i + '">' + esc(f[0]) + '</label>' +
        '<input id="fv' + i + '" type="text"' +
        (art === 'iban' ? ' inputmode="text" autocomplete="off" spellcheck="false"' : '') +
        (art ? ' data-pruef="' + art + '" aria-describedby="fe' + i + '"' : '') +
        ' value="' + esc(f[1]) + '">' +
        (art ? '<p class="feldfehler" id="fe' + i + '" role="alert"></p>' : '') +
        '</div>';
    }).join('') +
    (schritt.hinweis ? '<p class="hinweis">' + esc(schritt.hinweis) + '</p>' : '') +
    '<button type="button" class="knopf-voll" data-weiter="0">' + esc(schritt.senden || 'Absenden') + '</button></div>';
    host.innerHTML = h;

    var knopf = host.querySelector('[data-weiter]');
    var laeuft = false;
    knopf.addEventListener('click', function(){
      /* Schutz gegen doppeltes Absenden: der zweite Klick lief bisher einfach
         nochmal durch und baute den Schritt neu auf. */
      if (laeuft) return;
      if (!formularGeprueft(host)) return;
      laeuft = true;
      knopf.disabled = true;
      zeigeSchritt(host, schritt.dann);
    });
    /* Fehlermeldung verschwindet, sobald getippt wird — sie soll nicht
       stehen bleiben, waehrend jemand gerade korrigiert. */
    host.querySelectorAll('input[data-pruef]').forEach(function(inp){
      inp.addEventListener('input', function(){ feldFehler(inp, null); });
      inp.addEventListener('blur', function(){ if (inp.value.trim()) pruefeFeld(inp); });
    });
    return;
  }
  if (schritt.optionen) {
    h += '<div class="antworten">' + schritt.optionen.map(function(o, i){
      return '<button type="button" class="antwort' + (o.ernst ? ' ernst' : '') +
        '" data-o="' + i + '">' + esc(o.label) + '</button>';
    }).join('') + '</div>';
    host.innerHTML = h;
    host.addEventListener('click', function(e){
      var b = e.target.closest('[data-o]'); if (!b) return;
      zeigeSchritt(host, schritt.optionen[+b.dataset.o].dann);
    }, {once:true});
    return;
  }
  host.innerHTML = h;
}

/* \u2500\u2500 Feldpruefung \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
   SEPA-Mandat und Bankverbindung nahmen jede Eingabe an: keine Pruefziffer,
   keine Pflichtfelder, kein Schutz gegen doppeltes Absenden. Fuer die
   Vorfuehrung reicht das, aber es laedt im Pitch zur Rueckfrage ein.        */

/* IBAN-Laengen der Laender, die hier realistisch vorkommen. Steht ein Land
   nicht in der Liste, wird nur die Pruefziffer gerechnet, nicht die Laenge. */
var IBAN_LAENGE = { DE:22, AT:20, CH:21, LI:21, LU:20, NL:18, BE:16, FR:27,
                    IT:27, ES:24, PL:28, DK:18, SE:24, GB:22 };

/* Pruefziffer nach ISO 13616 / DIN 91101: die ersten vier Zeichen wandern
   nach hinten, Buchstaben werden zu Zahlen (A=10 \u2026 Z=35), der Rest modulo 97
   muss 1 ergeben. Stellenweise gerechnet \u2014 eine deutsche IBAN hat als Zahl
   20 Stellen und passt nicht mehr exakt in eine Gleitkommazahl. */
function ibanFehler(wert){
  var s = String(wert).toUpperCase().replace(/[\s\u00a0.\-]/g, "");
  if (!s) return "Bitte die IBAN eintragen.";
  if (!/^[A-Z]{2}[0-9]{2}[0-9A-Z]+$/.test(s))
    return "Eine IBAN beginnt mit zwei Buchstaben f\u00fcr das Land und zwei Pr\u00fcfziffern.";
  var land = s.slice(0, 2);
  if (IBAN_LAENGE[land] && s.length !== IBAN_LAENGE[land])
    return "Eine IBAN aus " + land + " hat " + IBAN_LAENGE[land] +
           " Zeichen, eingetragen sind " + s.length + ".";
  var um = s.slice(4) + s.slice(0, 4), rest = 0;
  for (var i = 0; i < um.length; i++) {
    var c = um.charCodeAt(i);
    var teil = (c >= 65) ? String(c - 55) : um.charAt(i);
    for (var j = 0; j < teil.length; j++) rest = (rest * 10 + (teil.charCodeAt(j) - 48)) % 97;
  }
  if (rest !== 1) return "Die Pr\u00fcfziffer dieser IBAN stimmt nicht \u2014 bitte noch einmal vergleichen.";
  return null;
}

function feldFehler(inp, text){
  var box = inp.parentNode.querySelector('.feldfehler');
  if (text) {
    inp.setAttribute('aria-invalid', 'true');
    if (box) { box.textContent = text; box.classList.add('an'); }
  } else {
    inp.removeAttribute('aria-invalid');
    if (box) { box.textContent = ''; box.classList.remove('an'); }
  }
}

function pruefeFeld(inp){
  var art = inp.dataset.pruef, wert = inp.value.trim();
  var fehler = null;
  if (art === 'iban') fehler = ibanFehler(wert);
  else if (art === 'pflicht' && !wert) fehler = 'Dieses Feld wird ben\u00f6tigt.';
  feldFehler(inp, fehler);
  return !fehler;
}

function formularGeprueft(host){
  var felder = host.querySelectorAll('input[data-pruef]');
  var ok = true, erstes = null;
  felder.forEach(function(inp){
    if (!pruefeFeld(inp)) { ok = false; if (!erstes) erstes = inp; }
  });
  if (erstes) erstes.focus();
  return ok;

/* Aufstufen kostet nur Geld und ist sofort wirksam. Herabstufen nimmt Leistungen
   weg — deshalb erst die Folgen zeigen, dann ein zweites Mal fragen. */
function stufenSchritt(k, ziel){
  var jetzt = stufeIndex(k.stufe), neu = stufeIndex(ziel);
  if (neu > jetzt) {
    wechseln(ziel);
    return null;
  }
  var behalten = {}; STUFEN[neu][2].forEach(function(l){ behalten[l] = true; });
  var verlust = [];
  for (var i = neu + 1; i <= jetzt; i++)
    STUFEN[i][2].forEach(function(l){ if (!behalten[l] && l.indexOf("alles aus") !== 0) verlust.push(l); });
  return { titel: "Von " + k.stufe + " zu " + ziel + " wechseln",
    warnung: { titel: "Diese Leistungen entfallen", punkte: verlust },
    optionen: [
      { label: "Ja, auf " + ziel + " herabstufen", ernst: true, dann: { tun: function(){ wechseln(ziel); } } },
      { label: "Doch nicht \u2014 " + k.stufe + " behalten", dann: { text: "Es bleibt bei " + k.stufe + "." } }
    ] };
}

/* Ein Zuhörer für alle Bereiche. Vorher hing an jedem .antwort dieselbe
   Sammelroutine, die immer nur „Danke" ausgab — die Knöpfe in Mitgliedschaft
   und Services taten damit sichtbar nichts. */
/* Das Antwortfeld steht im Markup unter der ganzen Liste. Wird oben eine Kachel
   geklickt, oeffnet es sich mobil ausserhalb des Sichtfelds — man tippt und
   scheinbar passiert nichts. Es wandert deshalb direkt hinter die geklickte
   Kachel und spannt die volle Rasterbreite. */
function feldNeben(box, kachel){
  if (!box || !kachel) return;
  var raster = kachel.closest("ul, .stufen");
  if (raster && raster.contains(kachel)) {
    box.style.gridColumn = "1 / -1";
    box.style.marginTop = "0";
    kachel.insertAdjacentElement("afterend", box);
    if (!raster.contains(box)) raster.insertBefore(box, kachel.nextSibling);
  }
}

document.getElementById("inhalt").addEventListener("click", function(e){
  var k = KONTEN[konto];

  var stufe = e.target.closest("[data-stufe]");
  if (stufe) {
    var schritt = stufenSchritt(k, stufe.dataset.stufe);
    if (schritt) {
      feldNeben(document.getElementById("stufenfeldbox"), stufe.closest(".stufe"));
      zeigeSchritt(document.getElementById("stufenfeld"), schritt);
    }
    return;
  }
  var dienst = e.target.closest("[data-dienst]");
  if (dienst) {
    feldNeben(document.getElementById("dienstbox"), dienst.closest("li"));
    zeigeSchritt(document.getElementById("dienstfeld"), dienstSchritt(k, +dienst.dataset.dienst));
    return;
  }
  var brett = e.target.closest("[data-start]");
  if (brett) {
    var feld = document.querySelector('.aktionsfeld[data-brett="' + brett.dataset.start + '"]');
    zeigeSchritt(feld, brettSchritt(k, +brett.dataset.start));
    return;
  }
  if (e.target.closest("[data-sepa]")) {
    zeigeSchritt(document.getElementById("sepafeld"),
      bankFormular(k, "Lastschriftmandat", "Mandat erteilen",
        "Mandat erteilt. Die n\u00e4chste Rechnung wird eingezogen; Sie k\u00f6nnen jederzeit widerrufen."));
    return;
  }
  if (e.target.closest("[data-beratung]")) {
    zeigeSchritt(document.getElementById("beratungfeld"), {
      titel: "Wie m\u00f6chten Sie die Beratung f\u00fchren?", optionen: [
        { label: "Jetzt anrufen", dann: { tun: function(){ location.href = "tel:+4929430000000"; } } },
        { label: "Um R\u00fcckruf bitten", dann: { text: "Notiert. Wir rufen am n\u00e4chsten Werktag zur\u00fcck." } },
        { label: "Beim n\u00e4chsten Hausbesuch besprechen",
          dann: { text: "Notiert. " + k.kraft.split(" ")[0] + " bringt die Abrechnung zum n\u00e4chsten Besuch mit." } }
      ] });
    return;
  }
  /* Rueckfrage auf „Heute" und Terminanfrage */
  var a = e.target.closest(".antwort");
  if (a && !a.dataset.o) {
    var box = a.closest(".antworten");
    if (box && !box.closest(".aktionsfeld")) {
      box.innerHTML = '<p class="danke"><span aria-hidden="true">\u2713</span>' +
        'Danke \u2014 wir haben es notiert und melden uns.</p>';
    }
  }
});
function geh(a){ ansicht = a; schublade(false); zeichne();
  document.querySelectorAll("#schubladeListe button").forEach(function(b){
    if (b.dataset.ans === ansicht) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
}

function bauNavigation(){
  /* Nur noch eine Liste: die Schublade. Die frueher parallel gebaute Reiterzeile
     ist entfallen, damit auch ihr Aufbau — sonst haetten die beiden Listen
     unterschiedliche Zustaende halten koennen. */
  document.getElementById("schubladeListe").innerHTML = BEREICHE.map(function(b){
    return '<li><button type="button" data-ans="'+b[0]+'">'+svg(b[0],28)+esc(b[1])+'</button></li>';
  }).join("");
  document.getElementById("schubladeListe").addEventListener("click", function(e){
    var b = e.target.closest("button[data-ans]"); if(!b) return; geh(b.dataset.ans);
  });
}

function schublade(auf){
  var s = document.getElementById("schublade"), b = document.getElementById("burger");
  s.classList.toggle("offen", auf);
  b.setAttribute("aria-expanded", auf ? "true" : "false");
  document.body.style.overflow = auf ? "hidden" : "";
  if (auf) { var f = s.querySelector("li button"); if (f) f.focus(); }
}
document.addEventListener("keydown", function(e){ if (e.key === "Escape") schublade(false); });
window.addEventListener("resize", function(){ if (innerWidth > 860) schublade(false); });

function waehlen(){
  var v = document.getElementById("rolle").value, a = APP[v];
  document.getElementById("kennung").value = a ? a.kennung : KONTEN[v].kennung;
  document.getElementById("anmeldeknopf").textContent = a ? a.knopf : "Anmelden";
  document.getElementById("gatehinweis").textContent = a ? a.hinweis
    : "Beispieldaten, keine echten Personen. Die Auswahl f\u00fcllt Kennung und Passwort.";
}
document.getElementById("rolle").addEventListener("change", waehlen);
waehlen();

function anmelden(){
  var v = document.getElementById("rolle").value;
  if (APP[v]) { location.href = APP[v].ziel; return; }
  konto = v;
  var k = KONTEN[konto];
  document.getElementById("personName").textContent = k.name;
  document.getElementById("avatar").textContent = k.initialen;
  document.getElementById("gate").classList.add("weg");
  document.getElementById("portal").hidden = false;
  ansicht = "heute";
  zeichne();
}
function abmelden(){
  schublade(false);
  document.getElementById("portal").hidden = true;
  document.getElementById("gate").classList.remove("weg");
  window.scrollTo(0,0);
}
bauNavigation();
</script>
