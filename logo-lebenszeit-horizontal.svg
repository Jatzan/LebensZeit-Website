<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="920" height="220"
     role="img" aria-label="LebensZeit gGmbH — Pflege, Gesundheit, Gemeinschaft">
  <title>LebensZeit gGmbH — Logo, horizontales Lockup (Sekundärvariante für Header/Footer)</title>
  <desc>Bildmarke links, Wortmarke und Claim rechts. Wortmarke in Georgia (Fallback Times New Roman).
        Farbe über currentColor: hell #4A6741 · dunkelgrün #A8C9A0 · Dark Mode #8AAC85 · Beige #5A6E52.
        Niemals weiß.</desc>
  <g color="#4A6741">
    <!-- ===== Bildmarke ===== -->
    <g transform="translate(6,5) scale(1.0)" fill="none" stroke="currentColor">
      <circle cx="50" cy="50" r="42" stroke-width="1" opacity="0.25"/>
      <g stroke-width="0.8" opacity="0.4">
        <line x1="50" y1="20" x2="79" y2="41"/>
        <line x1="79" y1="41" x2="68" y2="75"/>
        <line x1="68" y1="75" x2="32" y2="75"/>
        <line x1="32" y1="75" x2="21" y2="41"/>
        <line x1="21" y1="41" x2="50" y2="20"/>
        <line x1="50" y1="20" x2="68" y2="75"/>
        <line x1="50" y1="20" x2="32" y2="75"/>
        <line x1="79" y1="41" x2="32" y2="75"/>
        <line x1="79" y1="41" x2="21" y2="41"/>
        <line x1="68" y1="75" x2="21" y2="41"/>
      </g>
      <g fill="currentColor" stroke="none" opacity="0.9">
        <circle cx="50" cy="20" r="4"/>
        <circle cx="79" cy="41" r="4"/>
        <circle cx="68" cy="75" r="4"/>
        <circle cx="32" cy="75" r="4"/>
        <circle cx="21" cy="41" r="4"/>
      </g>
    </g>

    <!-- ===== Wortmarke + Claim ===== -->
    <text x="122" y="52" fill="currentColor"
          font-family="Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="2.2">LebensZeit</text>
    <text x="368" y="36" fill="currentColor" opacity="0.9"
          font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="1.4">gGmbH</text>
    <text x="124" y="76" fill="currentColor" opacity="0.9"
          font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="3.2">PFLEGE · GESUNDHEIT · GEMEINSCHAFT</text>
    <text x="124" y="96" fill="currentColor" opacity="0.75"
          font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="2">nah · vernetzt · nachhaltig</text>
  </g>
</svg>
