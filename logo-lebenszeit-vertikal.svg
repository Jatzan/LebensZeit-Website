<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="720" height="600"
     role="img" aria-label="LebensZeit gGmbH — Pflege, Gesundheit, Gemeinschaft">
  <title>LebensZeit gGmbH — Logo, vertikales Lockup (Primärvariante)</title>
  <desc>Bildmarke oben, darunter Wortmarke und zwei Claim-Zeilen.
        Wortmarke in Georgia (Fallback Times New Roman) gemäß Markenregel.
        Farbe über currentColor: hell #4A6741 · dunkelgrün #A8C9A0 · Dark Mode #8AAC85 · Beige #5A6E52.
        Niemals weiß.</desc>
  <g color="#4A6741">
    <!-- ===== Bildmarke ===== -->
    <g transform="translate(130,8) scale(1.0)" fill="none" stroke="currentColor">
      <circle cx="50" cy="50" r="42" stroke-width="1" opacity="0.25"/>
      <g stroke-width="0.8" opacity="0.4">
        <line x1="50" y1="20" x2="79" y2="41"/>
        <line x1="79" y1="41" x2="68" y2="75"/>
        <line x1="68" y1="75" x2="32" y2="75"/>
        <line x1="32" y1="75" x2="21" y2="41"/>
        <line x1="21" y1="41" x2="50" y2="20"/>
        <line x1="50" y1="20" x2="68" y2="75"/>
        <line x1="50" y1="20" x2="32" y2="75"/>
        <line x1="79" y1="41" x2="32" y2="75"/>
        <line x1="79" y1="41" x2="21" y2="41"/>
        <line x1="68" y1="75" x2="21" y2="41"/>
      </g>
      <g fill="currentColor" stroke="none" opacity="0.9">
        <circle cx="50" cy="20" r="4"/>
        <circle cx="79" cy="41" r="4"/>
        <circle cx="68" cy="75" r="4"/>
        <circle cx="32" cy="75" r="4"/>
        <circle cx="21" cy="41" r="4"/>
      </g>
    </g>

    <!-- ===== Wortmarke ===== -->
    <text x="180" y="168" text-anchor="middle" fill="currentColor"
          font-family="Georgia, 'Times New Roman', serif" font-size="44" letter-spacing="2.5">LebensZeit</text>
    <text x="180" y="192" text-anchor="middle" fill="currentColor" opacity="0.9"
          font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="3">gGmbH</text>

    <!-- ===== Claim-Zeilen ===== -->
    <text x="180" y="230" text-anchor="middle" fill="currentColor" opacity="0.9"
          font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" letter-spacing="3.4">PFLEGE · GESUNDHEIT · GEMEINSCHAFT</text>
    <line x1="112" y1="248" x2="248" y2="248" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
    <text x="180" y="270" text-anchor="middle" fill="currentColor" opacity="0.9"
          font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" letter-spacing="2.2">nah · vernetzt · nachhaltig</text>
  </g>
</svg>
