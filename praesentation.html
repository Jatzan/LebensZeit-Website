/* ══════════════════════════════════════════════════════════════════════
   PRÄSENTATIONSSCHICHT · LebensZeit gGmbH
   Foliendaten stehen als Liste im Skriptblock unten, das Layout kennt sie nicht.
   Farb- und Maßtokens ausschließlich aus /lz-tokens.css — kein zweiter
   :root-Block. Die Seite sitzt in der Umgebung .env-invest; Radius, Tap-Ziel
   und Schriftleiter kommen daher aus den semantischen Rollen.

   Zwei Folienarten nach dem Vorbild des Originals:
     .t-light  Creme — Standard, wie 20 der 24 Originalfolien
     .t-dark   Dunkelgrün — die vier Akzentfolien (Lieferantenmacht,
               Stoßrichtung, Investment Case, Schluss)
   Das Logo folgt der Farbregel: auf Creme Originalgrün, auf Dunkelgrün
   Mintgrün. Nie in Weiß.
   ══════════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-body);
  background:var(--lz-cream);
  color:var(--lz-ink);
  overflow:hidden;
}

/* ══ Bühne ══════════════════════════════════════════════════════════════
   inset oben = Höhe des Warnbalkens (--tick-h, von lz-notes.js gemessen).
   Feste 0 hätte denselben Fehler reproduziert, der beim Investoren-Gate und
   in der Cockpit-Anmeldung schon zweimal auftrat: der Balken lag darüber und
   deckte die Oberkante ab. Im Vollbild verschwindet der Balken (Ausnahme
   unten) — dort füllt die Bühne wieder den ganzen Viewport. */
.deck{
  position:fixed; inset:var(--tick-h, 2.375rem) 0 0 0; z-index:10;
  display:flex; flex-direction:column;
}
:fullscreen .deck, body.lz-is-fullscreen .deck{ inset:0 }

.slide{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden }
.slide[hidden]{display:none}

/* Einpassung — die Folie ist der Rahmen, .slide-inner der Inhalt.
   Ist der Inhalt höher als der Rahmen, verkleinert fitSlide() ihn über
   --fit, statt scrollen zu lassen: eine Präsentation wird nicht gescrollt.
   Gemessen: bei 1920x1080 passte alles, bei 1440x900 waren acht und bei
   1280x800 elf Folien zu hoch — Folie 3 um 201 px, Folie 12 um 192 px.
   zoom (nicht transform) ist hier richtig, weil es das LAYOUT skaliert und
   die Höhe damit wirklich sinkt; transform würde nur die Darstellung
   verzerren und scrollHeight unverändert lassen. Nebeneffekt und erwünscht:
   der Text bricht im verkleinerten Zustand günstiger um.
   min-height wird durch --fit geteilt, damit die Fußzeile trotz Verkleinerung
   auf der Unterkante sitzt (Prozentwerte gelten vor dem Zoom). */
/* Ränder als eigene Größen, damit der Vollbildmodus sie anheben kann.
   ALLE drei werden durch --fit geteilt — das ist der Kern der Sache:
   die Polsterung liegt im gezoomten Koordinatenraum, eine feste Angabe
   schrumpft also mit dem Inhalt. Vorher galt das nur für die Leistenhöhe
   unten, weshalb bei --fit 0,72 aus 84 px Seitenrand sichtbare 60 px
   wurden und die Folie randlos wirkte — genau der gemeldete Effekt.
   Geteilt bleibt der Rand in Gerätepixeln konstant; verkleinert wird
   ausschließlich der Inhalt. --hud-h setzt das Skript. */
.slide-inner{
  --pad-t: clamp(26px,4.4vw,66px);
  --pad-x: clamp(20px,5vw,88px);
  --pad-b: clamp(18px,2.4vw,34px);
  min-height:calc(100% / var(--fit, 1));
  display:flex; flex-direction:column;
  max-width:calc(1780px / var(--fit, 1)); margin-inline:auto;
  padding:calc(var(--pad-t) / var(--fit, 1)) calc(var(--pad-x) / var(--fit, 1))
          calc((var(--pad-b) + var(--hud-h, 60px)) / var(--fit, 1));
  zoom:var(--fit, 1);
}
/* Im Vollbild ist der Bildschirm die Bühne, nicht ein Fenster — dort darf
   der Rand deutlich großzügiger sein. Erst ab 1200 px, damit kleine
   Notebooks im Vollbild nicht auf einen Briefmarkeninhalt schrumpfen. */
@media (min-width:1200px){
  :fullscreen .slide-inner, body.lz-is-fullscreen .slide-inner{
    --pad-t: clamp(44px,5.2vh,88px);
    --pad-x: clamp(64px,7vw,150px);
    --pad-b: clamp(30px,3.6vh,56px);
  }
}

/* Folienkopf — Eyebrow links, Minutenmarke rechts, wie im Original */
.s-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-4);
  margin-bottom:var(--sp-3); flex-wrap:wrap;
}
.s-eyebrow{
  font-size:var(--fs-label); letter-spacing:.16em; text-transform:uppercase;
  font-weight:600; line-height:1.4;
}
.s-min{
  font-size:var(--fs-label); letter-spacing:.14em; text-transform:uppercase;
  white-space:nowrap; opacity:.72;
}
.slide h1,.slide h2{ font-family:var(--font-display); font-weight:400; line-height:1.12 }
.slide h1{ font-size:clamp(1.9rem,4.6vw,3.2rem) }
.slide h2{ font-size:clamp(1.55rem,3.5vw,2.5rem) }
.slide h2 em, .slide h1 em{ font-style:italic }
.s-lead{ font-size:clamp(.94rem,1.35vw,1.09rem); font-weight:300; max-width:60em; margin-top:var(--sp-4) }
.s-body{ margin-top:var(--sp-5) }
.s-foot{
  margin-top:auto; padding-top:var(--sp-5);
  display:flex; align-items:center; justify-content:space-between; gap:var(--sp-4);
  font-size:var(--fs-label); letter-spacing:.12em; text-transform:uppercase;
}

/* ── Umgebungsfarben der beiden Folienarten ───────────────────────────── */
.t-light{ background:var(--lz-cream); color:var(--lz-ink) }
.t-light h1,.t-light h2{ color:var(--lz-green-3) }
.t-light h1 em,.t-light h2 em{ color:var(--lz-green) }
.t-light .s-eyebrow{ color:var(--lz-green-2) }
.t-light .s-min,.t-light .s-lead,.t-light .s-foot{ color:var(--lz-ink-2) }

.t-dark{ background:linear-gradient(150deg,var(--lz-green-3) 0%,#243120 62%,var(--lz-green) 165%); color:var(--lz-cream) }
.t-dark h1,.t-dark h2{ color:var(--lz-cream) }
.t-dark h1 em,.t-dark h2 em{ color:var(--lz-mint) }
.t-dark .s-eyebrow{ color:var(--lz-sage) }
.t-dark .s-min{ color:rgba(245,240,232,.7) }
.t-dark .s-lead{ color:rgba(245,240,232,.9) }
.t-dark .s-foot{ color:rgba(245,240,232,.66) }

/* ══ Titel- und Schlussfolie ════════════════════════════════════════════ */
.s-cover{ align-items:center; justify-content:center; text-align:center }
.s-cover .lz-logo{ margin-bottom:var(--sp-6) }
.s-cover h1{ font-size:clamp(1.7rem,4vw,2.9rem); margin-bottom:var(--sp-5) }
.s-rule{ width:clamp(120px,28vw,320px); height:1px; background:var(--lz-hairline); margin:0 auto var(--sp-6) }
.t-dark .s-rule{ background:rgba(168,201,160,.4) }
.s-cover .s-meta{ font-size:var(--fs-label); letter-spacing:.16em; text-transform:uppercase; line-height:2 }
.t-light .s-cover .s-meta, .s-cover .s-meta{ color:var(--lz-ink-2) }
.t-dark .s-cover .s-meta{ color:rgba(245,240,232,.78) }

/* Wortmarke — Georgia/Times, ausschließlich hier. Farbe vom Container. */
.lz-logo{ display:inline-flex; flex-direction:column; align-items:center; gap:10px; color:var(--lz-green) }
.t-dark .lz-logo{ color:var(--lz-mint) }
.lz-logo svg{ width:clamp(54px,8vw,88px); height:auto; display:block }
.lz-logo .lz-mark{
  font-family:var(--font-mark); letter-spacing:var(--ls-mark);
  font-size:clamp(1.5rem,3.4vw,2.2rem); line-height:1; color:currentColor;
}
.lz-logo .lz-sub{ font-family:var(--font-body); font-size:var(--fs-label); letter-spacing:.1em; opacity:.9 }
.lz-logo .lz-tagline{
  font-family:var(--font-body); font-size:.72rem; letter-spacing:.2em;
  text-transform:uppercase; opacity:.78; margin-top:2px;
}
/* Fußzeilen-Logo, Kompaktstufe (24–40px) — offizielle Kurzform */
.lz-logo-compact{ display:inline-flex; align-items:center; gap:8px; color:var(--lz-green) }
.t-dark .lz-logo-compact{ color:var(--lz-sage) }
.lz-logo-compact svg{ width:26px; height:26px; flex:0 0 auto }
.lz-logo-compact .lz-mark{
  font-family:var(--font-mark); letter-spacing:var(--ls-mark); font-size:.95rem;
  text-transform:none; color:currentColor;
}

/* ══ Bausteine ══════════════════════════════════════════════════════════ */
.g-auto{ display:grid; gap:var(--sp-4); grid-template-columns:repeat(auto-fit,minmax(190px,1fr)) }
.g-auto > *{ min-width:0 }
.g-2{ display:grid; gap:var(--sp-4); grid-template-columns:repeat(auto-fit,minmax(280px,1fr)) }
.g-2 > *{ min-width:0 }
.g-3{ display:grid; gap:var(--sp-4); grid-template-columns:repeat(auto-fit,minmax(240px,1fr)) }
.g-3 > *{ min-width:0 }
/* Feste Zweispaltigkeit. auto-fit hat in der schmalen linken Spalte von
   Folie 3 drei Spuren gebildet und die Kennzahlen auf ~200px gequetscht —
   „2,1 Mio €" brach dabei um. */
.g-22{ display:grid; gap:var(--sp-4); grid-template-columns:repeat(2,minmax(0,1fr)) }
@media (max-width:620px){ .g-22{ grid-template-columns:1fr } }

/* Karte — Grundform aller Inhaltsblöcke */
.k{
  background:var(--lz-white); border:0.5px solid var(--lz-hairline);
  border-radius:var(--radius); padding:var(--sp-5);
}
.t-dark .k{ background:rgba(255,255,255,.07); border-color:rgba(168,201,160,.24) }
.k-lbl{
  font-size:var(--fs-label); letter-spacing:.14em; text-transform:uppercase;
  color:var(--lz-ink-2); margin-bottom:var(--sp-2); display:block;
}
.t-dark .k-lbl{ color:var(--lz-sage) }
.k-num{
  font-family:var(--font-display); font-weight:300; line-height:1;
  font-size:clamp(1.9rem,3.6vw,2.9rem); color:var(--lz-green-3);
}
.t-dark .k-num{ color:var(--lz-mint) }
.k-num.warn{ color:var(--lz-amber-ink) }
.k-num.crit{ color:var(--lz-red) }
.k-t{ font-family:var(--font-display); font-size:clamp(1.15rem,2vw,1.5rem); color:var(--lz-green-3); margin-bottom:var(--sp-2) }
.t-dark .k-t{ color:var(--lz-mint) }
.k-p{ font-size:.9rem; font-weight:300; color:var(--lz-ink-2); line-height:1.5; margin-top:var(--sp-2) }
.t-dark .k-p{ color:rgba(245,240,232,.85) }
.k-p + .k-p{ margin-top:var(--sp-3) }

/* Getönte Karten — Bewertung trägt die Fläche, nicht die Schrift allein */
.k.ok{   background:rgba(74,103,65,.07);  border-color:rgba(74,103,65,.3) }
.k.warn{ background:var(--tint-warn);      border-color:rgba(140,94,20,.3) }
.k.crit{ background:var(--tint-crit);      border-color:rgba(140,58,42,.3) }
.k.ok .k-t{ color:var(--lz-green-2) } .k.warn .k-t{ color:var(--lz-amber-ink) } .k.crit .k-t{ color:var(--lz-red) }
.k.ok  .k-lbl{ color:var(--lz-green-2) } .k.warn .k-lbl{ color:var(--lz-amber-ink) } .k.crit .k-lbl{ color:var(--lz-red) }

/* Listen */
ul.s-list{ list-style:none; display:flex; flex-direction:column; gap:var(--sp-2) }
ul.s-list li{ position:relative; padding-left:1.15em; font-size:.92rem; font-weight:300; line-height:1.5 }
ul.s-list li::before{ content:'·'; position:absolute; left:0; font-weight:700; opacity:.7 }
.t-light ul.s-list li{ color:var(--lz-ink-2) } .t-dark ul.s-list li{ color:rgba(245,240,232,.88) }
ul.s-list li b{ font-weight:500; color:var(--lz-ink) } .t-dark ul.s-list li b{ color:var(--lz-cream) }

/* Fünf-Kräfte-Zeile: Punkteskala 1–5.
   Der Wert hängt nicht an der Farbe — die Zahl „3/5" steht daneben und im
   aria-label, weil Amber und Grün sich in der Helligkeit kaum trennen. */
.force{ display:grid; grid-template-columns:minmax(0,13rem) auto minmax(0,1fr); gap:var(--sp-3) var(--sp-4);
        align-items:center; padding:var(--sp-3) var(--sp-4); border-radius:var(--radius); margin-bottom:var(--sp-2) }
.force > *{ min-width:0 }
.force-n{ font-size:.95rem; font-weight:500 }
.force-dots{ display:inline-flex; gap:5px; flex:0 0 auto }
.force-dots i{ width:11px; height:11px; border-radius:50%; background:var(--lz-cream-3); display:block }
.force-dots i.on{ background:var(--lz-green) }
.force.w .force-dots i.on{ background:var(--lz-amber) }
.force.c .force-dots i.on{ background:var(--lz-red) }
.force-txt{ font-size:.88rem; font-weight:300; color:var(--lz-ink-2); line-height:1.5 }
.force-txt b{ font-weight:500 }
.force.o{ background:rgba(74,103,65,.07) }  .force.o .force-n{ color:var(--lz-green-2) }  .force.o .force-txt b{ color:var(--lz-green-2) }
.force.w{ background:var(--tint-warn) }      .force.w .force-n{ color:var(--lz-amber-ink) } .force.w .force-txt b{ color:var(--lz-amber-ink) }
.force.c{ background:var(--tint-crit) }      .force.c .force-n{ color:var(--lz-red) }       .force.c .force-txt b{ color:var(--lz-red) }
@media (max-width:760px){ .force{ grid-template-columns:1fr; gap:var(--sp-2) } }

/* Tabelle */
.s-tbl{ width:100%; border-collapse:collapse; font-size:.86rem }
.s-tbl th,.s-tbl td{ text-align:left; padding:.5rem .7rem; border-bottom:0.5px solid var(--lz-hairline) }
.s-tbl th{ font-size:var(--fs-label); letter-spacing:.1em; text-transform:uppercase; font-weight:500;
           background:var(--lz-green-3); color:var(--lz-mint); border-bottom:none; white-space:nowrap }
.s-tbl td{ color:var(--lz-ink-2) } .s-tbl td:first-child{ color:var(--lz-ink) }
.s-tbl .num{ font-variant-numeric:tabular-nums; white-space:nowrap }
.s-tbl .st-ok{ color:var(--lz-green-2) } .s-tbl .st-bad{ color:var(--lz-red) } .s-tbl .st-warn{ color:var(--lz-amber-ink) }
.s-tbl tr.me td{ background:rgba(74,103,65,.09); font-weight:500; color:var(--lz-ink) }
.tbl-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100% }
.tbl-scroll > .s-tbl{ min-width:640px }
@media (min-width:900px){ .tbl-scroll > .s-tbl{ min-width:0 } }
/* Präsenzzeichen: Form UND Farbe, nie Farbe allein */
.p-full,.p-part,.p-none{ display:inline-flex; align-items:center; justify-content:center;
  width:20px; height:20px; border-radius:50%; font-size:.68rem; line-height:1 }
.p-full{ background:var(--lz-green); color:var(--lz-cream) }
.p-part{ background:var(--tint-warn); border:1.5px solid var(--lz-amber-ink); color:var(--lz-amber-ink) }
.p-none{ border:1px solid var(--lz-line-ui); color:var(--lz-ink-3) }

/* Persona */
.persona{ display:grid; grid-template-columns:minmax(0,15rem) minmax(0,1fr); gap:var(--sp-4) }
@media (max-width:820px){ .persona{ grid-template-columns:1fr } }
.p-card{ background:var(--lz-green-3); color:var(--lz-cream); border-radius:var(--radius); padding:var(--sp-5) }
.p-card.alt{ background:var(--lz-cream-2); color:var(--lz-ink) }
.p-ini{ width:52px; height:52px; border-radius:50%; border:1px solid currentColor;
        display:flex; align-items:center; justify-content:center; font-family:var(--font-display);
        font-size:1.15rem; margin-bottom:var(--sp-4); opacity:.9 }
.p-name{ font-family:var(--font-display); font-size:clamp(1.3rem,2.2vw,1.7rem); margin-bottom:var(--sp-3) }
.p-facts{ font-size:.76rem; letter-spacing:.1em; text-transform:uppercase; line-height:1.9; opacity:.82 }
.p-role{ font-size:var(--fs-label); letter-spacing:.14em; text-transform:uppercase; font-weight:600; margin-top:var(--sp-3) }
.p-card .p-role{ color:var(--lz-mint) } .p-card.alt .p-role{ color:var(--lz-green-2) }
.p-quote{ font-family:var(--font-display); font-style:italic; font-size:1.02rem; line-height:1.5;
          margin-top:var(--sp-4); padding-top:var(--sp-4); border-top:1px solid rgba(168,201,160,.3) }
.p-card.alt .p-quote{ border-top-color:var(--lz-hairline) }

/* Iterationskette V1 → V2 → V3 */
.chain{ display:grid; gap:var(--sp-3); grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); align-items:stretch }
.chain > *{ min-width:0 }
.chain .k{ display:flex; flex-direction:column }
.v-tag{ font-family:var(--font-display); font-size:1.6rem; color:var(--lz-green); line-height:1; margin-bottom:var(--sp-2) }
.t-dark .v-tag{ color:var(--lz-mint) }

/* Kritiker-Dialog: drei Spalten Kritik → Frage → Antwort */
.dlg{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:var(--sp-4) }
.dlg > *{ min-width:0 }
.dlg-col .k-lbl{ font-size:.72rem }
.dlg-q{ font-style:italic }

/* Zitatband */
.s-quote{
  font-family:var(--font-display); font-style:italic; font-size:clamp(1.05rem,2vw,1.4rem);
  line-height:1.5; padding-top:var(--sp-5); margin-top:var(--sp-5);
  border-top:1px solid var(--lz-hairline);
}
.t-dark .s-quote{ border-top-color:rgba(168,201,160,.35); color:var(--lz-cream-2) }
.s-quote.center{ text-align:center }

/* Prompt — wortwörtliches Zitat */
.prompt{
  font-family:var(--font-display); font-style:italic; font-size:.98rem; line-height:1.55;
  color:var(--lz-green-3);
}
.t-dark .prompt{ color:var(--lz-cream-2) }
.pill{
  display:inline-block; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; font-weight:600;
  padding:.3rem .8rem; border-radius:var(--r-pill); margin-bottom:var(--sp-3);
  background:var(--lz-green-3); color:var(--lz-mint);
}
.pill.amber{ background:var(--lz-amber-ink); color:var(--lz-cream) }

/* ══ F/A/E/O-Kennzeichnung ══════════════════════════════════════════════
   Labelpflicht des Projekts. Die Marke trägt Buchstabe + Titel, nicht nur
   Farbe — bei Deuteranopie fallen Amber und Grün sonst zusammen. */
.lbl{
  display:inline-block; font-size:.66rem; font-weight:700; line-height:1;
  padding:.16rem .34rem; border-radius:4px; margin-left:.34em; vertical-align:.1em;

/* Korrekturhinweis — jede Stelle, an der diese Fassung vom Original abweicht,
   ist gekennzeichnet. Eingeklappt, weil die Folie im Pitch die Aussage tragen
   soll und nicht den Änderungsnachweis: die Kurzzeile bleibt immer sichtbar,
   die Begründung ist einen Klick entfernt. Ausgeklappt sind acht Folien bei
   1440x900 zu hoch geworden — nachgemessen, deshalb <details>. */
.fix{
  margin-top:var(--sp-4);
  border-left:3px solid var(--lz-amber-ink); background:var(--tint-warn);
  border-radius:0 var(--r-sm) var(--r-sm) 0;
  font-size:.82rem; font-weight:300; line-height:1.55; color:var(--lz-ink-2);
}
.fix > summary{
  cursor:pointer; list-style:none; display:flex; gap:.55em; align-items:center;
  padding:.5rem var(--sp-4); min-height:44px;
  font-weight:600; color:var(--lz-amber-ink);
}
.fix > summary::-webkit-details-marker{ display:none }
.fix > summary::before{ content:'▸'; flex:0 0 auto; font-size:.9em; opacity:.85 }
.fix[open] > summary::before{ content:'▾' }
.fix > summary:hover{ text-decoration:underline; text-underline-offset:3px }
.fix .fix-body{ padding:0 var(--sp-4) var(--sp-4) }
.fix b{ font-weight:600; color:var(--lz-amber-ink) }
.fix .was{ text-decoration:line-through; text-decoration-color:rgba(140,58,42,.6); opacity:.7 }
.t-dark .fix{ background:rgba(226,181,106,.14); border-left-color:#E2B56A; color:rgba(245,240,232,.88) }
.t-dark .fix b, .t-dark .fix > summary{ color:#E2B56A }
.faeo{ margin-top:var(--sp-3); font-size:.74rem; opacity:.66 }

.deck-progress{

}
.slide-dark-active ~ .deck-progress{ background:var(--lz-mint) }
.deck-hud{

.deck-btn{
  min-height:40px; min-width:40px; border-radius:50%; cursor:pointer;
  border:1px solid var(--lz-line-ui); background:transparent; color:var(--lz-green-2);

   wird — dieselbe Lösung wie .lz-round in lz-tokens.css. */
.deck-btn::after{ content:''; position:absolute; top:50%; left:50%; width:48px; height:48px; transform:translate(-50%,-50%) }
.deck-btn:hover{ background:rgba(74,103,65,.1) }
body.on-dark .deck-btn{ border-color:rgba(168,201,160,.45); color:var(--lz-mint) }

  font-size:var(--fs-label); letter-spacing:.08em; color:var(--lz-green-2);

}
body.on-dark .deck-exit{ color:var(--lz-mint) }

/* Bedienleiste auf dem Telefon — nachgemessen: mit ausgeschriebenem
   „Investorenbereich" brauchte die Leiste 433 px bei 390 px Viewport und
   weitete damit die GANZE Seite auf (dieselbe Fehlerklasse wie im
   Wettbewerbs-Dashboard). Der Zähler machte es sichtbar: ab Folie 10
   wurden aus 433 px 442 px, weil „10 / 24" breiter ist als „1 / 24".
   Deshalb bleibt unter 620 px nur der Pfeil stehen; die Beschriftung
   traegt weiterhin das aria-label. */
@media (max-width:620px){
  .deck-hud{ padding:.5rem 10px; gap:8px }
  .deck-exit .deck-exit-t{ display:none }
  .deck-nav{ gap:6px }
  .deck-btn{ min-height:38px; min-width:38px }
}
:focus-visible{ outline:2px solid var(--lz-green); outline-offset:2px }
body.on-dark :focus-visible{ outline-color:var(--lz-mint) }

/* Folienverzeichnis (Taste 0 oder Klick auf den Zähler) */

  position:absolute; inset:0; z-index:30; display:none;

}

  width:100%; text-align:left; background:none; border:0; border-bottom:0.5px solid var(--lz-hairline);
  padding:.55rem .3rem; font:inherit; font-size:.88rem; color:var(--lz-ink-2); cursor:pointer;

    return `<div class="s-cover" style="margin:auto;text-align:center">

   ══════════════════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  const deck = document.getElementById('deck');
  const hud  = deck.querySelector('.deck-hud');
  const progress = document.getElementById('deckProgress');
  const countEl  = document.getElementById('deckCount');
  const toc = document.getElementById('toc');
  const tocList = document.getElementById('tocList');
  let i = 0;

  /* Folien aufbauen */
  SLIDES.forEach((s, idx) => {
    const sec = document.createElement('section');
    sec.className = 'slide t-' + (s.theme || 'light');
    sec.setAttribute('aria-roledescription', 'Folie');
    sec.setAttribute('aria-label', `Folie ${idx+1} von ${SLIDES.length}`);
    sec.dataset.index = idx;
    if (idx !== 0) sec.hidden = true;
    sec.innerHTML = renderSlide(s);
    deck.insertBefore(sec, toc);
  });
  const slides = deck.querySelectorAll('.slide');

  /* Verzeichnis */
  SLIDES.forEach((s, idx) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    /* Titel enthaelt <em>; fuer das Verzeichnis nur den Text nehmen */
    const tmp = document.createElement('span'); tmp.innerHTML = s.title || '';
    b.textContent = tmp.textContent;
    b.addEventListener('click', () => { show(idx); toggleToc(false); });
    li.appendChild(b); tocList.appendChild(li);
  });
  const tocBtns = tocList.querySelectorAll('button');

  /* ── Einpassung ───────────────────────────────────────────────────────
     Verkleinert den Folieninhalt so weit, dass er in den Rahmen passt.
     Erst der lineare Schätzwert, dann in wenigen Schritten wieder
     vergrößern, solange es noch passt — der lineare Wert schießt immer
     über das Ziel, weil der Text nach dem Verkleinern günstiger umbricht.
     Untergrenze 0,62; darunter würde die kleinste Stufe (0,80rem) unter
     die typografische Untergrenze des Projekts fallen.
     Kein zoom im Browser? Dann bleibt es beim Scrollen — kein Ausfall. */
  const canZoom = window.CSS && CSS.supports && CSS.supports('zoom', '0.8');
  const FIT_MIN = 0.68;

  /* Auf dem Telefon wird NICHT eingepasst. Dort bräuchten fast alle Folien
     den Anschlag von 0,68 und wären damit unlesbar — 0,80rem mal 0,68 liegt
     weit unter der typografischen Untergrenze des Projekts. Am Telefon ist
     Scrollen die richtige Bedienung, am Projektor das Einpassen. */
  const shouldFit = () => window.innerWidth >= 820 && window.innerHeight >= 480;

  function fitSlide(slide){
    if (!slide) return;
    const inner = slide.querySelector('.slide-inner');
    if (!inner) return;
    if (!canZoom || !shouldFit()) {
      inner.style.removeProperty('--fit');
      slide.style.overflowY = '';      /* zurueck auf Scrollen, siehe unten */
      return;
    }

    const set = v => inner.style.setProperty('--fit', String(v));

    /* Messgrundlage — zweimal nachgemessen, beide naheliegenden Wege sind falsch:
         scrollHeight des Rahmens ändert sich unter zoom überhaupt nicht.
         getBoundingClientRect des gezoomten Elements liefert seine Größe im
         EIGENEN, noch nicht skalierten Koordinatenraum (Chrome 141: zoom 0.5
         gesetzt, Rechteckhöhe unverändert 861 px).
       Richtig ist deshalb: Rechteckhöhe MAL Zoomfaktor = Sichthöhe.
       min-height wird zum Messen abgeschaltet, sonst ist der Inhalt per
       Definition immer genau so hoch wie der Rahmen. */
    const prevMin = inner.style.minHeight;
    inner.style.minHeight = '0px';
    const avail  = slide.getBoundingClientRect().height - 2;
    const visual = v => { set(v); return inner.getBoundingClientRect().height * v; };

    let z = 1;
    const natural = visual(1);
    if (natural > avail && natural > 0) {
      /* Bisektion statt linearer Schätzung. Der lineare Weg (avail/natural,
         danach halbschrittig zurück) hat funktioniert, solange die Sichthöhe
         proportional zu --fit war. Seit die Ränder ebenfalls durch --fit
         geteilt werden, gilt das nicht mehr: der Inhalt skaliert, der Rand
         bleibt konstant. Die Bisektion braucht diese Annahme nicht und
         endet zudem garantiert auf einem Wert, der nachgemessen passt —
         das vorherige Sicherheitsnetz mit 12 Schritten à 0,025 konnte
         auslaufen, ohne die Passung erreicht zu haben. */
      let lo = FIT_MIN, hi = 1;
      if (visual(lo) > avail) {
        z = lo;                       /* Anschlag: lieber Restscrollen als unlesbar */
      } else {
        for (let k = 0; k < 9; k++) {
          const mid = (lo + hi) / 2;
          if (visual(mid) <= avail) lo = mid; else hi = mid;
        }
        z = lo;
      }
      set(z);
    }
    inner.style.minHeight = prevMin;
    if (z >= 0.999) inner.style.removeProperty('--fit');

    /* Dritte Eigenart von zoom, nachgemessen: Chrome bildet scrollHeight des
       Rahmens aus der UNskalierten Höhe des gezoomten Kindes. Der Rahmen hält
       sich deshalb für zu klein und ließ sich um bis zu 130 px in leeren Raum
       schieben, obwohl sichtbar nichts abgeschnitten war — auf Folie 12 bei
       1024x768 gemessen. Passt der Inhalt nachgemessen, wird das Scrollen
       deshalb abgeschaltet. Nur am Anschlag FIT_MIN, wo der Inhalt wirklich
       zu hoch bleibt, bleibt es erlaubt: lieber scrollen als abschneiden.
       Verglichen wird gegen die Rahmenhöhe selbst, nicht gegen avail: avail
       hat 2 px Sicherheitsabzug, min-height füllt den Rahmen aber exakt aus —
       gegen avail gemessen wäre die Prüfung immer negativ ausgefallen. */
    const rahmen = slide.getBoundingClientRect().height;
    const passt = inner.getBoundingClientRect().height * (z || 1) <= rahmen + 1;
    /* clip, nicht hidden: ein hidden-Rahmen bleibt ein Scrollcontainer und
       lässt sich per Skript, Tastatur und Trackpad-Impuls weiter verschieben.
       clip macht ihn gar nicht erst zu einem — aber nur, wenn BEIDE Achsen
       clip sind: mit overflow-x:hidden aus dem Stylesheet rechnet Chrome ein
       overflow-y:clip wieder auf hidden zurück, dann war 130 px Leerlauf
       weiter erreichbar (nachgemessen). Deshalb die Kurzform für beide. */
    if (passt) slide.style.overflow = 'clip';
    else { slide.style.removeProperty('overflow'); slide.style.overflowY = 'auto'; }
    slide.scrollTop = 0;
  }

  function show(n){
    n = Math.max(0, Math.min(SLIDES.length - 1, n));
    slides[i].hidden = true;
    i = n;
    const cur = slides[i];
    cur.hidden = false;
    cur.scrollTop = 0;
    fitSlide(cur);
    countEl.textContent = (i+1) + ' / ' + SLIDES.length;
    progress.style.width = ((i+1) / SLIDES.length * 100) + '%';
    /* Die Bedienleiste liegt ueber der Folie und muss ihre Helligkeit kennen:
       auf der dunklen Folie waere Creme-auf-Creme unlesbar. */
    const dark = (SLIDES[i].theme === 'dark');
    document.body.classList.toggle('on-dark', dark);
    progress.style.background = dark ? 'var(--lz-mint)' : 'var(--lz-green)';
    tocBtns.forEach((b, x) => b.setAttribute('aria-current', x === i ? 'true' : 'false'));
    history.replaceState(null, '', '#' + (i+1));
  }
  const next = () => show(i+1);
  const prev = () => show(i-1);

  function toggleToc(force){
    const open = (typeof force === 'boolean') ? force : !toc.classList.contains('open');
    toc.classList.toggle('open', open);
    document.getElementById('deckToc').setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) tocBtns[i] && tocBtns[i].focus();
  }

  document.getElementById('deckNext').addEventListener('click', next);
  document.getElementById('deckPrev').addEventListener('click', prev);
  document.getElementById('deckToc').addEventListener('click', () => toggleToc());
  countEl.addEventListener('click', () => toggleToc());

  document.addEventListener('keydown', e => {
    if (e.target.closest('.toc') && e.key !== 'Escape' && e.key !== '0') return;
    switch (e.key) {
      case 'ArrowRight': case 'PageDown': case ' ': e.preventDefault(); next(); break;
      case 'ArrowLeft':  case 'PageUp': case 'Backspace': e.preventDefault(); prev(); break;
      case 'Home': show(0); break;
      case 'End':  show(SLIDES.length - 1); break;
      case '0':    e.preventDefault(); toggleToc(); break;
      case 'f': case 'F': toggleFullscreen(); break;
      case 'Escape':
        if (toc.classList.contains('open')) { toggleToc(false); }
        else if (!document.fullscreenElement) { location.href = '/investoren'; }
        break;
    }
  });

  /* Vollbild — Warnbalken-Ausnahme ist im <style> dokumentiert. */
  function toggleFullscreen(){
    if (!document.fullscreenElement) {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => document.body.classList.add('lz-is-fullscreen'));
      else document.body.classList.toggle('lz-is-fullscreen');
    } else {
      document.exitFullscreen();
    }
  }
  document.getElementById('deckFull').addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', () => {
    document.body.classList.toggle('lz-is-fullscreen', !!document.fullscreenElement);
    if (window.lzMeasureTick) window.lzMeasureTick();
  });

  /* Wischen auf dem Telefon. Nur waagerecht und nur ausserhalb eines
     Scrollbereichs, sonst kollidiert es mit dem Scrollen der Folie und
     dem seitlichen Scrollen der Praesenzmatrix. */
  let tx = 0, ty = 0, tracking = false;
  deck.addEventListener('touchstart', e => {
    if (e.target.closest('.tbl-scroll, .toc')) { tracking = false; return; }
    tracking = true; tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  deck.addEventListener('touchend', e => {
    if (!tracking) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.8) { dx < 0 ? next() : prev(); }
  }, {passive:true});

  /* Neu einpassen, wenn sich die Rahmenhöhe oder der Inhalt ändert:
     Fenstergröße, Vollbild-Wechsel, Drehen des Telefons, und beim Auf- oder
     Zuklappen eines Korrekturhinweises. Die Schriften werden abgewartet —
     vorher misst man Rückfallmetrik und passt auf die falsche Höhe ein. */
  /* Höhe der Bedienleiste an das Layout melden, damit die Folie unten
     genug Platz freihält. Gemessen statt geschätzt — die Leiste wächst mit
     der Schriftgröße und auf schmalen Geräten. */
  function measureHud(){
    const h = Math.ceil(hud.getBoundingClientRect().height);
    if (h > 0) deck.style.setProperty('--hud-h', h + 'px');
  }

  let rt;
  const refit = () => { clearTimeout(rt); rt = setTimeout(() => { measureHud(); fitSlide(slides[i]); }, 120); };
  window.addEventListener('resize', refit);
  window.addEventListener('orientationchange', refit);
  document.addEventListener('fullscreenchange', refit);
  deck.addEventListener('toggle', e => { if (e.target.classList.contains('fix')) fitSlide(slides[i]); }, true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);

  /* Einstieg ueber #12 erlaubt das Verlinken einzelner Folien */
  measureHud();
  const fromHash = parseInt((location.hash || '').replace('#',''), 10);
  show(Number.isFinite(fromHash) && fromHash >= 1 ? fromHash - 1 : 0);
})();
</script>
