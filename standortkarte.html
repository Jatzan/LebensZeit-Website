<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Standortkarte — LebensZeit gGmbH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;font-family:'Jost',sans-serif;background:#F5F0E8;color:#2A2820;}body{padding:12px 4px 8px;}#map{height:460px;}</style>
</head>
<body>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  #map { width: 100%; height: 480px; border-radius: 14px; border: 0.5px solid rgba(74,103,65,.18); }
  .leaflet-popup-content-wrapper { border-radius: 12px !important; border: 0.5px solid #e0ddd8; box-shadow: 0 4px 16px rgba(0,0,0,0.10) !important; padding: 0; overflow: hidden; }
  .leaflet-popup-content { margin: 0 !important; width: 240px !important; }
  .popup-header { padding: 12px 14px 8px; border-bottom: 0.5px solid #f0ede8; }
  .popup-name { font-size: 14px; font-weight: 500; color: #1a1917; margin: 0 0 1px; }
  .popup-role { font-size: 11px; color: #888780; margin: 0; }
  .popup-body { padding: 10px 14px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  
  
  
  
  
  
  
  
  
  .trend-neg { background: #FCEBEB; color: #791F1F; }
  .trend-pos { background: #EAF3DE; color: #27500A; }
  .trend-neu { background: #F1EFE8; color: #5F5E5A; }
  .hs-badge { display: inline-block; font-size: 10px; background: #E6F1FB; color: #0C447C; padding: 2px 7px; border-radius: 999px; margin-top: 3px; }
  .legend { position: absolute; bottom: 20px; left: 12px; z-index: 999; background: rgba(255,255,255,0.95); border: 0.5px solid #e0ddd8; border-radius: 10px; padding: 10px 13px; font-size: 11px; color: #5F5E5A; }
  .legend-item { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .legend-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 0 1.5px rgba(0,0,0,0.15); }
  .legend-note { font-size: 10px; color: #888780; margin-top: 4px; border-top: 0.5px solid #e0ddd8; padding-top: 5px; }
  .info-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 10px; font-size: 12px; color: #5A5648; }
</style>

<div class="info-bar">
  <span style="font-weight: 500; font-size: 13px; color: #2A2820;">LebensZeit gGmbH — Geschäftsgebiet Hellweg/Soest</span>
  <span style="font-size: 11px; color: #8A8478;">Klick auf einen Marker zeigt das Leistungsangebot</span>
</div>

<div style="position: relative;">
  <div id="map"></div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background: #4A6741;"></div> Hauptstandort</div>
    <div class="legend-item"><div class="legend-dot" style="background: #8AAC85;"></div> Standort</div>
    <div class="legend-note"><br></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* Leaflet kommt von einem externen CDN (unpkg). Fehlt es — Netzsperre, Offline,
   CDN-Ausfall —, warf die erste Zeile einen ReferenceError und der ganze Block
   brach ab: zurueck blieb eine leere Flaeche ohne jeden Hinweis. Diese Datei
   liegt als iframe in einzugsgebiet.html, der Fehler war dort also unsichtbar
   im Rahmen versteckt. Dieselbe stille Art Fehler wie beim Cockpit-Kartenmodul
   und beim Wettbewerbsdashboard, deshalb dieselbe Loesung: sichtbarer Hinweis
   statt abgebrochenem Skript. Die Legende darunter bleibt lesbar. */
if (typeof L === 'undefined') {
  var mapEl = document.getElementById('map');
  if (mapEl) {
    mapEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;' +
      'height:100%;padding:24px;text-align:center;font-size:0.88rem;line-height:1.5;' +
      'color:#5f5e5a;background:#F5F0E8">Kartenbibliothek nicht geladen ' +
      '(Leaflet, externes CDN).<br>Die Standortliste im Einzugsgebiet ist davon nicht betroffen.</div>';
  }
} else {

const map = L.map('map', { zoomControl: true, scrollWheelZoom: false }).setView([51.575, 8.29], 11);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const locations = [
  {
    name: "Erwitte",
    angebot: "Grund- und Behandlungspflege · Beratung · Begegnungsort · Verwaltung",
    role: "Hauptstandort",
    lat: 51.6062, lng: 8.3403,
    color: "#4A6741",
    },
  {
    name: "Bad Sassendorf",
    angebot: "Grund- und Behandlungspflege · Beratung · Begegnungsort",
    role: "Standort",
    lat: 51.5886, lng: 8.1707,
    color: "#8AAC85",
    },
  {
    name: "Anröchte",
    angebot: "Grund- und Behandlungspflege · Beratung",
    role: "Standort",
    lat: 51.5622, lng: 8.3256,
    color: "#8AAC85",
    },
  {
    name: "Rüthen",
    angebot: "Grund- und Behandlungspflege · Beratung",
    role: "Standort",
    lat: 51.4925, lng: 8.4370,
    color: "#8AAC85",
    },
  {
    name: "Lippetal",
    angebot: "Grund- und Behandlungspflege · Beratung",
    role: "Standort",
    lat: 51.6637, lng: 8.1443,
    color: "#8AAC85",
    }
];

function makeIcon(color, isMain) {
  const size = isMain ? 18 : 14;
  const ring = isMain ? 3 : 2;
  return L.divIcon({
    className: '',
    html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:${ring}px solid white;box-shadow:0 0 0 1.5px ${color},0 2px 8px rgba(0,0,0,0.18);"></div>`,
    iconSize: [size, size],
    iconAnchor: [size/2, size/2]
  });
}

function fmtNum(n) { return n.toLocaleString('de-DE'); }

locations.forEach(loc => {
  const isMain = loc.role === "Hauptstandort";
  const isCrit = loc.trendType === "neg" && loc.role.includes("Kritisch");
  const marker = L.marker([loc.lat, loc.lng], { icon: makeIcon(loc.color, isMain) }).addTo(map);

  
  
  

  const popup = `
    <div class="popup-head">
      <div class="popup-title">${loc.name}</div>
      <div class="popup-role">${loc.role}</div>
    </div>
    <div style="padding:10px 2px 2px;font-size:12.5px;color:#3d3c38;line-height:1.5;">
      ${loc.angebot}
    </div>
  `;

  marker.bindPopup(popup, { maxWidth: 260, minWidth: 240 });
});

setTimeout(() => map.invalidateSize(), 300);

} /* Ende else-Zweig der Leaflet-Pruefung oben */
</script>

</body>
</html>
